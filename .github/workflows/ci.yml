name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android NDK and standalone toolchains
        uses: actions/cache@v4
        with:
          path: |
            tools/android-ndk-r17c
            tools/android-ndk-r17c-windows-x86_64.zip
            tools/android-toolchain-arm64
            tools/android-toolchain-x86_64
          key: ${{ runner.os }}-milena-ndk-r17c-v1

      - name: Install Inno Setup
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }

      - name: Run NVDA driver tests
        run: python -m unittest tests/test_milena_nvda_driver.py

      - name: Build Windows installer
        run: .\build_milena_installer.ps1

      - name: Build NVDA add-on
        run: python .\build_milena_nvda_addon.py

      - name: Build Android packages
        run: .\build_milena_android.ps1

      - name: Build release checksums
        run: .\build_release_checksums.ps1

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: milena-dist
          path: |
            dist/installer/*.exe
            dist/nvda/*.nvda-addon
            dist/android/*.apk
            dist/android/*.aab
            dist/release/*.txt
